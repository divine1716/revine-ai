
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <meta name="description" content="Revine AI - best for what ever u can think off">
  <meta name="theme-color" content="#0d0d0d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Revine AI</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <!-- Mobile Menu Button -->
  <button class="mobile-menu-btn" id="mobile-menu-btn" aria-label="Open menu">
    ☰
  </button>

  <!-- Mobile Overlay -->
 

  <div class="mobile-overlay" id="mobile-overlay"></div>

  <!-- Sidebar -->
  <div class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <h2>💬 Revine AI</h2>
      <button class="new-chat-btn" onclick="createNewChat()">+ New Chat</button>
    </div>
    <div class="chat-history" id="chat-history">
      <div class="loading-chats">Loading chats...</div>
    </div>
    <div class="sidebar-footer">
      <div class="user-info">
        <span>👤 User</span>
        <button class="settings-btn" onclick="toggleSettings()" title="Settings">⚙️</button>
      </div>
    </div>
  </div>

  <!-- Main Chat Area -->
  <div class="main-container">
    <div class="chat-header">
      <h3>Revine AI Assistant</h3>
      <div style="display: flex; gap: 10px; align-items: center;">
        <span class="memory-badge" title="Conversation memory active">🧠 Memory</span>
        <span class="status online">● Online</span>
      </div>
    </div>

    <div id="chat-box" class="chat-box">
      <div class="welcome-message">
        <div class="welcome-icon"><img src="/static/revine ai logo.jpeg" alt="Revine AI Logo" style="width: 100%; height: 100%; object-fit: contain;"></div>
        <h1>Welcome to Revine AI</h1>
        <p>Your intelligent assistant created by Divine Emmanuel</p>
        <div class="suggestions">
          <button class="suggestion" onclick="sendSuggestion('Explain quantum computing')">🔬 Explain quantum computing</button>
          <button class="suggestion" onclick="sendSuggestion('Write a Python function')">💻 Write a Python function</button>
          <button class="suggestion" onclick="sendSuggestion('Tell me a joke')">😄 Tell me a joke</button>
          <button class="suggestion" onclick="sendSuggestion('Help me learn JavaScript')">📚 Help me learn JavaScript</button>
        </div>
      </div>
    </div>

    <div class="input-container">
      <!-- File Preview Area -->
      <div id="file-preview" class="file-preview" style="display: none;"></div>
      
      <div class="input-wrapper">
        <!-- Attachment Button -->
        <button id="attach-btn" class="attach-btn" title="Attach file" onclick="document.getElementById('file-input').click()">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
            <path d="M21.44 11.05l-9.19 9.19a6 6 0 01-8.49-8.49l9.19-9.19a4 4 0 015.66 5.66l-9.2 9.19a2 2 0 01-2.83-2.83l8.49-8.48" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
        
        <!-- Mic Button -->
        <button id="mic-btn" class="attach-btn mic-btn" title="🎤 Click to record voice message">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
            <path d="M12 14a3 3 0 003-3V6a3 3 0 10-6 0v5a3 3 0 003 3zm5-3a5 5 0 01-10 0M19 11v1a7 7 0 01-14 0v-1M12 19v3" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
        
        <!-- Hidden File Input -->
        <input type="file" id="file-input" multiple hidden accept="image/*,.pdf,.txt,.md,.csv,.json,.xml,.html,.doc,.docx,audio/*">
        
        <textarea 
          id="user-input" 
          placeholder="Message Revine AI..." 
          rows="1"
          onkeydown="handleKeyPress(event)"
        ></textarea>
        
        <!-- TTS Toggle -->
        <button id="tts-toggle" class="attach-btn tts-toggle" aria-pressed="true" title="Voice: On">
          🔊
        </button>
        
        <button id="send-btn" onclick="sendMessage()" disabled>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
            <path d="M7 11L12 6L17 11M12 18V7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>
    </div>
  </div>

  <script src="/static/script.js"></script>
</body>
</html>
